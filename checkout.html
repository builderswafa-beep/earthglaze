<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout – Shipping Details | EarthGlaze Natural Skincare</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#FAF7F2] text-stone-800 font-sans antialiased selection:bg-[#1E3B2B] selection:text-white min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-[#FAF7F2] border-b border-[#E8DEC8]/80 py-4">
    <div class="max-w-[1200px] mx-auto px-4 sm:px-6 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-[#1E3B2B] flex items-center justify-center text-white text-base font-serif">🌱</div>
        <span class="font-serif font-bold text-xl text-[#1E3B2B]">EarthGlaze</span>
      </a>

      <!-- 3-Step Checkout Stepper matching Portfolio Reference -->
      <div class="flex items-center gap-2 sm:gap-4 text-xs font-semibold">
        <div class="flex items-center gap-1.5 text-[#1E3B2B]">
          <span class="w-6 h-6 rounded-full bg-[#1E3B2B] text-white flex items-center justify-center text-xs">1</span>
          <span class="hidden sm:inline">Shipping</span>
        </div>
        <span class="text-stone-300">───</span>
        <div class="flex items-center gap-1.5 text-stone-400">
          <span class="w-6 h-6 rounded-full bg-stone-200 text-stone-600 flex items-center justify-center text-xs">2</span>
          <span class="hidden sm:inline">Payment</span>
        </div>
        <span class="text-stone-300">───</span>
        <div class="flex items-center gap-1.5 text-stone-400">
          <span class="w-6 h-6 rounded-full bg-stone-200 text-stone-600 flex items-center justify-center text-xs">3</span>
          <span class="hidden sm:inline">Review</span>
        </div>
      </div>

      <a href="cart.html" class="text-xs text-stone-500 hover:text-[#1E3B2B] font-medium flex items-center gap-1">
        <span>Back to Cart</span>
      </a>
    </div>
  </header>

  <!-- Main Checkout Content -->
  <main class="max-w-[1200px] mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-1 w-full">
    
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Left Column: Shipping Form -->
      <div class="lg:col-span-7 bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-[#E8DEC8] space-y-6">
        <div>
          <h1 class="text-2xl font-serif font-bold text-[#1E3B2B]">Shipping Details</h1>
          <p class="text-xs text-stone-500 mt-1">Please provide your delivery information for safe, tracked transit.</p>
        </div>

        <form id="shipping-form" class="space-y-4">
          
          <!-- Full Name -->
          <div>
            <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">
              Full Name <span class="text-red-500">*</span>
            </label>
            <input 
              type="text" 
              id="cust-name" 
              required 
              placeholder="e.g. Ayesha N." 
              value="Ayesha N."
              class="w-full text-xs sm:text-sm px-4 py-3 bg-stone-50 rounded-xl border border-stone-300 focus:outline-none focus:border-[#1E3B2B]"
            >
          </div>

          <!-- Contact Row (Phone + Email) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">
                Phone Number <span class="text-red-500">*</span>
              </label>
              <input 
                type="tel" 
                id="cust-phone" 
                required 
                placeholder="+91 98765 43210" 
                value="+91 98765 43210"
                class="w-full text-xs sm:text-sm px-4 py-3 bg-stone-50 rounded-xl border border-stone-300 focus:outline-none focus:border-[#1E3B2B]"
              >
            </div>
            <div>
              <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">
                Email Address <span class="text-red-500">*</span>
              </label>
              <input 
                type="email" 
                id="cust-email" 
                required 
                placeholder="ayesha@example.com" 
                value="ayesha@example.com"
                class="w-full text-xs sm:text-sm px-4 py-3 bg-stone-50 rounded-xl border border-stone-300 focus:outline-none focus:border-[#1E3B2B]"
              >
            </div>
          </div>

          <!-- Street Address -->
          <div>
            <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">
              Delivery Address <span class="text-red-500">*</span>
            </label>
            <input 
              type="text" 
              id="cust-address" 
              required 
              placeholder="House/Flat No., Building, Street Name, Landmark" 
              value="Deralakatte, Near University Campus"
              class="w-full text-xs sm:text-sm px-4 py-3 bg-stone-50 rounded-xl border border-stone-300 focus:outline-none focus:border-[#1E3B2B]"
            >
          </div>

          <!-- City, State, PIN Code Row matching Portfolio Reference -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">
                City <span class="text-red-500">*</span>
              </label>
              <input 
                type="text" 
                id="cust-city" 
                required 
                placeholder="Mangalore" 
                value="Mangalore"
                class="w-full text-xs sm:text-sm px-4 py-3 bg-stone-50 rounded-xl border border-stone-300 focus:outline-none focus:border-[#1E3B2B]"
              >
            </div>
            <div>
              <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">
                State <span class="text-red-500">*</span>
              </label>
              <input 
                type="text" 
                id="cust-state" 
                required 
                placeholder="Karnataka" 
                value="Karnataka"
                class="w-full text-xs sm:text-sm px-4 py-3 bg-stone-50 rounded-xl border border-stone-300 focus:outline-none focus:border-[#1E3B2B]"
              >
            </div>
            <div>
              <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">
                PIN Code <span class="text-red-500">*</span>
              </label>
              <input 
                type="text" 
                id="cust-pincode" 
                required 
                placeholder="575018" 
                value="575018"
                class="w-full text-xs sm:text-sm px-4 py-3 bg-stone-50 rounded-xl border border-stone-300 focus:outline-none focus:border-[#1E3B2B]"
              >
            </div>
          </div>

          <!-- Delivery Instructions (Optional) -->
          <div>
            <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">
              Delivery Instructions (Optional)
            </label>
            <input 
              type="text" 
              id="cust-notes" 
              placeholder="Leave with security or call on arrival" 
              class="w-full text-xs sm:text-sm px-4 py-2.5 bg-stone-50 rounded-xl border border-stone-300 focus:outline-none focus:border-[#1E3B2B]"
            >
          </div>

          <!-- Submit Button -->
          <div class="pt-4">
            <button 
              type="submit" 
              class="w-full py-4 bg-[#1E3B2B] hover:bg-[#14291E] text-white font-bold text-sm rounded-2xl transition shadow-lg hover:shadow-xl flex items-center justify-center gap-2 active:scale-95"
            >
              <span>Continue to Payment</span>
              <span>→</span>
            </button>
          </div>

        </form>
      </div>

      <!-- Right Column: Order Summary -->
      <div class="lg:col-span-5 bg-white rounded-3xl p-6 shadow-sm border border-[#E8DEC8] space-y-6 sticky top-24">
        <h2 class="font-serif font-bold text-lg text-[#1E3B2B] border-b border-stone-200 pb-3">Your Items</h2>

        <!-- Items mini list -->
        <div id="checkout-items-list" class="space-y-3 max-h-60 overflow-y-auto pr-1">
          <!-- Filled dynamically -->
        </div>

        <!-- Calculations -->
        <div class="pt-4 border-t border-stone-200 space-y-2.5 text-xs sm:text-sm">
          <div class="flex justify-between text-stone-600">
            <span>Subtotal</span>
            <span class="font-bold text-stone-900" id="summary-subtotal">₹0</span>
          </div>

          <div id="summary-discount-row" class="hidden justify-between text-emerald-700">
            <span>Coupon Savings</span>
            <span class="font-bold" id="summary-discount">-₹0</span>
          </div>

          <div class="flex justify-between text-stone-600">
            <span>Express Delivery</span>
            <span class="font-bold text-emerald-700">FREE</span>
          </div>

          <div class="pt-3 border-t border-stone-200 flex justify-between items-baseline text-base sm:text-lg">
            <span class="font-serif font-bold text-stone-900">Final Total</span>
            <span class="font-bold text-xl sm:text-2xl text-[#1E3B2B]" id="summary-total">₹0</span>
          </div>
        </div>

        <div class="p-3 bg-[#FAF7F2] rounded-xl border border-stone-200 text-xs text-stone-600 flex items-center gap-2">
          <span>🌿</span>
          <span>Each order comes in an artisan eco-friendly gift box.</span>
        </div>
      </div>

    </div>

  </main>

  <script src="js/store.js"></script>
  <script>
    (function() {
      const cart = EarthGlazeStore.getCart();
      if (!cart.length) {
        window.location.href = 'shop.html';
        return;
      }

      // Render summary items
      const itemsList = document.getElementById('checkout-items-list');
      itemsList.innerHTML = cart.map(item => `
        <div class="flex items-center gap-3">
          <img src="${item.image}" alt="" class="w-12 h-12 object-contain bg-[#FAF7F2] rounded-xl p-1 shrink-0 border border-stone-200">
          <div class="flex-1 min-w-0">
            <h4 class="text-xs font-bold text-stone-900 truncate">${item.name}</h4>
            <span class="text-[11px] text-stone-500">Qty: ${item.quantity}</span>
          </div>
          <span class="text-xs font-bold text-[#1E3B2B]">₹${Math.round(item.price * item.quantity)}</span>
        </div>
      `).join('');

      // Get saved totals or recalculate
      const savedTotals = JSON.parse(sessionStorage.getItem('earthglaze_checkout_totals') || '{}');
      const subtotal = savedTotals.subtotal || EarthGlazeStore.getCartSubtotal();
      const discount = savedTotals.discount || 0;
      const finalTotal = savedTotals.finalTotal || (subtotal - discount);

      document.getElementById('summary-subtotal').textContent = `₹${Math.round(subtotal)}`;
      if (discount > 0) {
        document.getElementById('summary-discount').textContent = `-₹${Math.round(discount)}`;
        document.getElementById('summary-discount-row').classList.remove('hidden');
        document.getElementById('summary-discount-row').classList.add('flex');
      }
      document.getElementById('summary-total').textContent = `₹${Math.round(finalTotal)}`;

      // Prefill if customer logged in
      const user = EarthGlazeStore.getUser();
      if (user) {
        if (user.name) document.getElementById('cust-name').value = user.name;
        if (user.phone) document.getElementById('cust-phone').value = user.phone;
        if (user.email) document.getElementById('cust-email').value = user.email;
        if (user.address) document.getElementById('cust-address').value = user.address;
        if (user.city) document.getElementById('cust-city').value = user.city;
        if (user.state) document.getElementById('cust-state').value = user.state;
        if (user.pincode) document.getElementById('cust-pincode').value = user.pincode;
      }

      // Handle form submission
      document.getElementById('shipping-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const shippingInfo = {
          name: document.getElementById('cust-name').value.trim(),
          phone: document.getElementById('cust-phone').value.trim(),
          email: document.getElementById('cust-email').value.trim(),
          address: document.getElementById('cust-address').value.trim(),
          city: document.getElementById('cust-city').value.trim(),
          state: document.getElementById('cust-state').value.trim(),
          pincode: document.getElementById('cust-pincode').value.trim(),
          notes: document.getElementById('cust-notes').value.trim()
        };

        sessionStorage.setItem('earthglaze_shipping_info', JSON.stringify(shippingInfo));
        window.location.href = 'payment.html';
      });
    })();
  </script>
</body>
</html>
